# Runs the whole app in containers: PostgreSQL + Spring Boot API + React SPA.
# Start:  docker compose up --build      Stop:  docker compose down
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskmanager
      POSTGRES_USER: taskmanager
      POSTGRES_PASSWORD: taskmanager
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmanager -d taskmanager"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/taskmanager
      POSTGRES_USER: taskmanager
      POSTGRES_PASSWORD: taskmanager
      # Override in a .env file next to this compose file; must have 32+ characters.
      JWT_SECRET: ${JWT_SECRET:-docker-demo-secret-change-me-0123456789abcdef}
      JWT_EXPIRATION_MINUTES: 60
      # The SPA runs on another origin, so the API must allow it explicitly.
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      ADMIN_EMAIL: admin@taskmanager.local
      ADMIN_PASSWORD: Admin12345
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  db-data:
