<svg viewBox="0 0 320 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="2" y="2" width="316" height="636" rx="24" fill="#ffffff" stroke="#333333" stroke-width="3"/>
  <rect x="2" y="2" width="316" height="24" rx="12" fill="#e2e2e2"/>
  <text x="160" y="18" font-size="10" fill="#333" text-anchor="middle">9:41</text>

  <rect x="2" y="26" width="316" height="56" fill="#4a5568"/>
  <text x="285" y="60" font-size="16" fill="#fff" text-anchor="middle">&#8592;</text>
  <text x="160" y="60" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Nueva tarea</text>

  <!-- campo titulo -->
  <text x="20" y="108" font-size="11" fill="#555">Título</text>
  <rect x="16" y="114" width="288" height="34" rx="6" fill="#f5f5f5" stroke="#bbb"/>
  <text x="26" y="136" font-size="11" fill="#999">Ej: Leer capítulo 3</text>

  <!-- campo asignatura -->
  <text x="20" y="168" font-size="11" fill="#555">Asignatura</text>
  <rect x="16" y="174" width="288" height="34" rx="6" fill="#f5f5f5" stroke="#bbb"/>
  <text x="26" y="196" font-size="11" fill="#999">Seleccionar asignatura</text>
  <text x="290" y="196" font-size="11" fill="#999">&#9662;</text>

  <!-- campo fecha limite -->
  <text x="20" y="228" font-size="11" fill="#555">Fecha límite</text>
  <rect x="16" y="234" width="140" height="34" rx="6" fill="#f5f5f5" stroke="#bbb"/>
  <text x="26" y="256" font-size="11" fill="#999">dd/mm/aaaa</text>
  <rect x="164" y="234" width="140" height="34" rx="6" fill="#f5f5f5" stroke="#bbb"/>
  <text x="174" y="256" font-size="11" fill="#999">hh:mm</text>

  <!-- campo descripcion -->
  <text x="20" y="288" font-size="11" fill="#555">Descripción</text>
  <rect x="16" y="294" width="288" height="80" rx="6" fill="#f5f5f5" stroke="#bbb"/>
  <line x1="26" y1="312" x2="280" y2="312" stroke="#ddd" stroke-width="2"/>
  <line x1="26" y1="328" x2="260" y2="328" stroke="#ddd" stroke-width="2"/>
  <line x1="26" y1="344" x2="200" y2="344" stroke="#ddd" stroke-width="2"/>

  <!-- recordatorio (deseable) -->
  <text x="20" y="400" font-size="11" fill="#555">Recordatorio</text>
  <rect x="248" y="388" width="56" height="26" rx="13" fill="#cbd5e0"/>
  <circle cx="290" cy="401" r="10" fill="#4a5568"/>

  <!-- boton guardar -->
  <rect x="16" y="440" width="288" height="44" rx="8" fill="#4a5568"/>
  <text x="160" y="467" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">Guardar tarea</text>

  <rect x="16" y="496" width="288" height="44" rx="8" fill="none" stroke="#999"/>
  <text x="160" y="523" font-size="14" fill="#666" text-anchor="middle">Cancelar</text>

  <text x="160" y="616" font-size="11" fill="#777" text-anchor="middle">Pantalla 2 · Crear / editar tarea</text>
</svg>
